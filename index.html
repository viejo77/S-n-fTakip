<!doctype html>
<html lang="tr">
  <head>
    <script>
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          if (
            (args[0] === '[vite]' && args[1] && String(args[1]).includes('send')) ||
            (typeof args[0] === 'string' && args[0].includes('[vite]') && args[0].includes('send'))
          ) {
            return;
          }
          origError.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function(e) {
          if (e?.reason?.message?.includes?.('send') || e?.reason?.message?.includes?.('WebSocket')) {
            e.preventDefault?.();
          }
        });
      })();
    </script>

    <script>
      // Clear old SW caches during development so preview iframe always shows the freshest version
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const registration of registrations) {
            registration.unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then((names) => {
          for (const name of names) {
            caches.delete(name);
          }
        });
      }
    </script>
