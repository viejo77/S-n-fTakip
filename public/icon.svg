<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Inner Soft Container -->
  <g filter="url(#shadow)">
    <!-- Clipboard / Tablet Board -->
    <rect x="116" y="96" width="280" height="340" rx="36" fill="#ffffff" />
    
    <!-- Clipboard Header Clip -->
    <rect x="196" y="76" width="120" height="42" rx="14" fill="#0d9488" />
    <circle cx="256" cy="97" r="8" fill="#ffffff" />

    <!-- Checklist / Progress Lines -->
    <!-- Line 1: Checkmark Item -->
    <circle cx="168" cy="180" r="18" fill="#ccfbf1" />
    <path d="M161 180 L166 185 L176 174" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="204" y="172" width="150" height="16" rx="8" fill="#e2e8f0" />

    <!-- Line 2: Star Item -->
    <circle cx="168" cy="245" r="18" fill="#fef3c7" />
    <path d="M168 236 L170.8 242.2 L177.5 242.9 L172.5 247.3 L174 254 L168 250.4 L162 254 L163.5 247.3 L158.5 242.9 L165.2 242.2 Z" fill="url(#starGrad)" />
    <rect x="204" y="237" width="130" height="16" rx="8" fill="#e2e8f0" />

    <!-- Line 3: Homework / Plus Item -->
    <circle cx="168" cy="310" r="18" fill="#e0f2fe" />
    <path d="M168 302 L168 318 M160 310 L176 310" stroke="#0284c7" stroke-width="4" stroke-linecap="round" fill="none" />
    <rect x="204" y="302" width="165" height="16" rx="8" fill="#e2e8f0" />

    <!-- Line 4: Grade Indicator -->
    <rect x="150" y="360" width="212" height="42" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2" />
    <text x="256" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0f766e" text-anchor="middle">
      100 Tam Puan ★
    </text>
  </g>

  <!-- Plus Badge on top right -->
  <g filter="url(#shadow)">
    <circle cx="396" cy="116" r="42" fill="#f59e0b" stroke="#ffffff" stroke-width="6" />
    <path d="M396 98 L396 134 M378 116 L414 116" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
